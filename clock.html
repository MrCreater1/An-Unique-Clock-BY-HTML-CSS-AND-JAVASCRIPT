<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="clock.css" />
  </head>
  <body>
    <div id="clock-container">
      <div id="clock">00:00:00</div>
      <div id="date">00.00.0000</div>
    </div>
    <div id="colors">
      <div id="red">🔴</div>
      <div id="yellow">🟡</div>
      <div id="blue">🔵</div>
      <div id="green">🟢</div>
      <div id="white">⚪</div>
      <div id="orange">🟠</div>
      <div id="purple">🟣</div>
      <div id="brown">🟤</div>
      <div id="black">⚫</div>
    </div>
    <script src="clock.js"></script>
  </body>
</html>
